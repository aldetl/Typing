help.introduction=Typing 让您在输入文字时，使用 Vim 和 Emacs 风格的控制方式快速移动光标，并通过自定义按键映射执行便捷操作。\r\n\r\n以下示例使用 Default 配置：\r\n    • Vim 风格：轻按“Caps Lock”进入命令模式，然后按“I / J / K / L”向上 / 左 / 下 / 右移动。\r\n    • Emacs 风格：按住“Caps Lock”，再按“I / J / K / L”，直接向上 / 左 / 下 / 右移动。\r\n    • 按键映射：“Alt+C” → “Ctrl+C”执行复制操作。“Alt+H” → “Ctrl+Left”将光标移到单词开头。
